name: MXQ edge SD image 7.2

on:
  workflow_dispatch:
  push:
    branches:
      - edge-mxq-7.2-patches
    paths:
      - ".github/workflows/mxq-edge-image.yml"
      - "config/boards/aml-s805-mxq.tvb"
      - "config/sources/families/include/meson_common.inc"
      - "config/kernel/linux-meson-edge.config"
      - "patch/kernel/archive/meson-7.2/**"
      - "config/bootscripts/boot-aml-s805-mxq.cmd"
      - "config/bootenv/aml-s805-mxq.txt"

concurrency:
  group: mxq-edge-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: aml-s805-mxq / edge / trixie minimal
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker system prune -af || true
          echo "After:"; df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Nested Docker image builds need host-registered qemu for armhf chroot.
      - name: Set up QEMU (armhf binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Install qemu-user-static / arch-test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support arch-test
          ls -la /proc/sys/fs/binfmt_misc/ | head -40
          arch-test armhf
          arch-test arm

      # Caches, so that iterating on the meson-7.2 patches does not rebuild
      # everything: the kernel git and the rootfs rarely change (keyed once);
      # ccache changes every run (keyed per run, restored from the latest).
      # GitHub drops caches unused for 7 days, so after a pause the first
      # build is a full one again.
      - name: Restore kernel sources and rootfs cache
        uses: actions/cache@v4
        with:
          path: |
            cache/git-bare
            cache/rootfs
          key: mxq-edge-src-${{ hashFiles('config/sources/families/include/meson_common.inc') }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: cache/ccache
          key: mxq-edge-ccache-${{ github.run_id }}
          restore-keys: mxq-edge-ccache-

      - name: Build SD image
        run: |
          chmod +x compile.sh
          ./compile.sh \
            BOARD=aml-s805-mxq \
            BRANCH=edge \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            USE_CCACHE=yes \
            KERNEL_GIT=shallow \
            CLEAN_LEVEL=make,debs \
            SHOW_LOG=yes \
            ALLOW_ROOT=yes \
            SKIP_EXTERNAL_TOOLCHAINS=yes \
            COMPRESS_OUTPUTIMAGE=sha,xz \
            DOCKER_PRIVILEGED=yes

      # the build runs as root in Docker; let actions/cache read what it wrote
      - name: Make caches readable
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" cache/ccache cache/git-bare cache/rootfs 2>/dev/null || true
          du -sh cache/ccache cache/git-bare cache/rootfs 2>/dev/null || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find output/images -type f \( -name '*.img' -o -name '*.img.xz' -o -name '*.sha' -o -name '*.txt' \) \
            -print -exec cp -a {} artifacts/ \; || true
          ls -lah artifacts output/images 2>/dev/null || true

      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: aml-s805-mxq-edge-trixie-minimal
          path: |
            artifacts/
            output/images/*
          if-no-files-found: error
          retention-days: 14
