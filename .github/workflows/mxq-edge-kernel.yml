name: MXQ edge kernel 7.2

on:
  workflow_dispatch:
  push:
    branches:
      - edge-mxq-7.2
      - edge-mxq-7.2-patches
    paths:
      - "config/boards/aml-s805-mxq.tvb"
      - "config/sources/families/include/meson_common.inc"
      - "config/kernel/linux-meson-edge.config"
      - "patch/kernel/archive/meson-7.2/**"
      - ".github/workflows/mxq-edge-kernel.yml"

concurrency:
  group: mxq-edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    name: aml-s805-mxq / edge (7.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker system prune -af || true
          echo "After:"; df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build kernel packages
        run: |
          chmod +x compile.sh
          # Native host build on the runner (no nested Docker). Armbian
          # auto-detects GITHUB_ACTIONS; ALLOW_ROOT covers sudo steps.
          ./compile.sh kernel \
            BOARD=aml-s805-mxq \
            BRANCH=edge \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            USE_CCACHE=no \
            CLEAN_LEVEL=make,debs \
            SHOW_LOG=yes \
            ALLOW_ROOT=yes \
            SKIP_EXTERNAL_TOOLCHAINS=yes \
            ARTIFACT_IGNORE_CACHE=yes

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find output -type f \( -name '*.deb' -o -name 'uImage' -o -name '*.dtb' -o -name 'System.map*' -o -name 'config-*' \) \
            -print -exec cp -a {} artifacts/ \; || true
          ls -lah artifacts || true
          ls -lah output/debs || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aml-s805-mxq-edge-kernel
          path: |
            artifacts/
            output/debs/*.deb
            output/config/
          if-no-files-found: error
          retention-days: 14
